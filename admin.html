<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach James | 內部管理與 AI 智能排班系統</title>
  
  <!-- 引入 Tailwind CSS、FontAwesome、FullCalendar -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'court-navy': '#0B132B',
            'court-dark': '#060B19',
            'neon-green': '#CCFF00',
            'accent-cyan': '#00E5FF',
          }
        }
      }
    }
  </script>

  <!-- 管理員密碼驗證防護 -->
  <script>
    (function() {
      const ADMIN_PASSWORD = "coachjames888";
      let isAuthed = sessionStorage.getItem("admin_authenticated");

      if (!isAuthed) {
        const inputPass = prompt("🔒 請輸入 Coach James 後台管理密碼：");
        if (inputPass === ADMIN_PASSWORD) {
          sessionStorage.setItem("admin_authenticated", "true");
        } else {
          alert("❌ 密碼錯誤！系統將返回官網首頁。");
          window.location.href = "index.html";
        }
      }
    })();
  </script>
</head>

<body class="bg-court-dark text-slate-100 font-sans min-h-screen">

  <!-- 頂部導覽列 -->
  <header class="bg-court-navy border-b border-slate-800 px-6 py-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-neon-green/20 border border-neon-green flex items-center justify-center text-neon-green font-black text-lg">
        PJ
      </div>
      <div>
        <h1 class="text-base font-black text-white flex items-center gap-2">
          <span>Coach James 管理後台</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-neon-green text-black font-extrabold uppercase">Admin Portal</span>
        </h1>
        <p class="text-xs text-slate-400">AI 智能 8 週排班 ✕ 互動式課堂管理 ✕ 補堂提醒</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <a href="index.html" class="px-3 py-1.5 rounded-xl border border-slate-700 hover:border-slate-500 text-slate-300 text-xs font-bold transition-all">
        <i class="fa-solid fa-house mr-1"></i>返回官網
      </a>
      <button onclick="logoutAdmin()" class="px-3 py-1.5 rounded-xl bg-rose-600/25 hover:bg-rose-600/40 text-rose-400 border border-rose-500/30 text-xs font-bold transition-all">
        <i class="fa-solid fa-right-from-bracket mr-1"></i>安全登出
      </button>
    </div>
  </header>

  <!-- 主體內容區塊 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid lg:grid-cols-12 gap-8 items-start">

      <!-- 左側欄：報名清單與 8 週排班精靈 (佔 5 欄) -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- AI 智能 8 週排班面板 -->
        <div class="bg-court-navy border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
          <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h2 class="text-base font-black text-white flex items-center gap-2">
              <i class="fa-solid fa-robot text-neon-green"></i> AI 智能 8 週排班精靈
            </h2>
            <span class="text-[11px] font-bold text-slate-400" id="pendingCountText">待處理報名: 載入中...</span>
          </div>
          
          <p class="text-xs text-slate-400 leading-relaxed">
            系統會自動對應你的 5 大官方課程（新手、急救、技術體能修正、高手、1對1私教），並自動分派港島/九龍球場。
          </p>

          <button onclick="loadSubmissionsFromGoogleSheet()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-neon-green to-accent-cyan text-slate-950 font-black text-xs shadow-neon hover:opacity-90 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate-right"></i>
            <span>重新整理 Google Sheet 數據</span>
          </button>
        </div>

        <!-- Tally / Google Sheet 報名接收清單 -->
        <div class="bg-court-navy border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
          <h3 class="text-xs font-extrabold uppercase tracking-widest text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-inbox text-accent-cyan"></i> 新進報名申請 (Tally.so Submissions)
          </h3>

          <div id="realSubmissionsContainer" class="space-y-3">
            <div class="bg-slate-900/60 rounded-2xl p-6 text-center border border-slate-800 text-slate-400 text-xs space-y-2">
              <i class="fa-solid fa-spinner fa-spin text-neon-green text-xl"></i>
              <p>正在載入 Google Sheet 報名數據...</p>
            </div>
          </div>
        </div>

      </div>

      <!-- 右側欄：FullCalendar.js 行事曆 (佔 7 欄) -->
      <div class="lg:col-span-7 bg-court-navy border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
          <div>
            <h2 class="text-lg font-black text-white flex items-center gap-2">
              <i class="fa-solid fa-calendar-days text-accent-cyan"></i> 導師授課總行事曆
            </h2>
            <p class="text-xs text-slate-400">💡 提示：**點擊任何一堂課**即可開啟互動選單，進行顏色更改、批量變更或刪除補堂！</p>
          </div>
          <button onclick="calendar.refetchEvents()" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-bold text-slate-300 hover:bg-slate-800 transition-all">
            <i class="fa-solid fa-rotate-right mr-1"></i>重新整理
          </button>
        </div>

        <div id="calendar" class="min-h-[580px] text-xs"></div>
      </div>

    </div>
  </main>

  <!-- 🎯 點擊課堂時彈出的互動管理視窗 (Modal) -->
  <div id="classModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-court-navy border border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm font-black text-neon-green flex items-center gap-2">
          <i class="fa-solid fa-gear"></i> 課堂管理與批量調配
        </h3>
        <button onclick="closeClassModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 font-bold mb-1">目前課堂標題與學員：</label>
          <p id="modalEventTitle" class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-slate-200 font-bold"></p>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">1. 更改行事曆顯示顏色（標籤狀態）：</label>
          <div class="flex gap-2">
            <button onclick="changeEventColor('#CCFF00', '#060B19')" class="px-3 py-1.5 rounded-lg bg-[#CCFF00] text-black font-bold text-[11px]">螢光綠 (正常)</button>
            <button onclick="changeEventColor('#00E5FF', '#060B19')" class="px-3 py-1.5 rounded-lg bg-[#00E5FF] text-black font-bold text-[11px]">青藍 (已確認)</button>
            <button onclick="changeEventColor('#F59E0B', '#060B19')" class="px-3 py-1.5 rounded-lg bg-amber-500 text-black font-bold text-[11px]">黃金 (需留意)</button>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 font-bold mb-1">2. 批量修改此學員未來所有課程（變更名稱/球場）：</label>
          <div class="flex gap-2">
            <input type="text" id="modalBatchInput" placeholder="例：技術與體能精準修正班 (abc) @ 歌和老街" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-neon-green">
            <button onclick="executeModalBatchUpdate()" class="bg-accent-cyan text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs hover:opacity-90">批量套用</button>
          </div>
        </div>

        <div class="pt-2 border-t border-slate-800">
          <button onclick="deleteCurrentEventWithMakeup()" class="w-full bg-rose-600/20 hover:bg-rose-600/40 text-rose-400 border border-rose-500/30 font-black py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-trash-can"></i>
            <span>刪除此堂課（並觸發補堂提醒）</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯 -->
  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJEpvuMYqokI74iHwjWknZm2cAmQ4kQQrX0EvPh8JwClSMq8zM9uqxaJBp8je7IKsdzHv7_k1rrHN_/pub?gid=133817439&single=true&output=csv";

    let calendar;
    let activeModalEvent = null; // 當前被點擊選中的行事曆事件

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '08:00:00',
        slotMaxTime: '23:00:00',
        allDaySlot: false,
        locale: 'zh-tw',
        editable: true,
        selectable: true,
        
        // 點擊既有課程時打開美觀的管理 Modal
        eventClick: function(info) {
          activeModalEvent = info.event;
          document.getElementById('modalEventTitle').innerText = activeModalEvent.title;
          document.getElementById('modalBatchInput').value = activeModalEvent.title;
          document.getElementById('classModal').classList.remove('hidden');
        },

        events: []
      });
      calendar.render();

      loadSubmissionsFromGoogleSheet();
    });

    function closeClassModal() {
      document.getElementById('classModal').classList.add('hidden');
      activeModalEvent = null;
    }

    // 1. 改變事件顏色
    function changeEventColor(bgColor, txtColor) {
      if (!activeModalEvent) return;
      activeModalEvent.setProp('backgroundColor', bgColor);
      activeModalEvent.setProp('borderColor', bgColor);
      activeModalEvent.setProp('textColor', txtColor);
      alert("✅ 課堂顯示顏色已更新！");
      closeClassModal();
    }

    // 2. 批量修改此學員所有相關課程
    function executeModalBatchUpdate() {
      if (!activeModalEvent) return;
      const newTitle = document.getElementById('modalBatchInput').value;
      if (!newTitle) {
        alert("請輸入有效的課程標題！");
        return;
      }

      // 提取原本事件裏的學生名字以便辨識
      const allEvents = calendar.getEvents();
      let count = 0;
      allEvents.forEach(ev => {
        // 如果標題包含相同的學生名字，則一併批量修改
        if (ev.title.includes("(") && activeModalEvent.title.includes("(")) {
          let originalName = activeModalEvent.title.match(/\((.*?)\)/)[1];
          if (ev.title.includes(`(${originalName})`)) {
            ev.setProp('title', newTitle);
            count++;
          }
        }
      });

      alert(`✅ 成功批量更新了該學員的 ${count} 堂課！`);
      closeClassModal();
    }

    // 3. 刪除課程並觸發補堂詢問
    function deleteCurrentEventWithMakeup() {
      if (!activeModalEvent) return;
      if (confirm(`⚠️ 確定要刪除「${activeModalEvent.title}」嗎？`)) {
        activeModalEvent.remove();
        closeClassModal();
        
        // 主動詢問是否需要安排補堂
        setTimeout(() => {
          const needMakeUp = confirm("🔄 您剛剛手動刪除了一堂課。請問是否需要立刻為該學員安排「補堂」？\n\n[確定] = 系統將引導您安排補堂");
          if (needMakeUp) {
            alert("✨ 已記錄！您可以直接在行事曆上任意空白時段點擊新增補堂課。");
          }
        }, 300);
      }
    }

    // 智慧解析 CSV 函數
    function parseCSVRow(text) {
      const lines = text.split(/\r\n|\n/);
      return lines.map(line => {
        const result = [];
        let cell = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(cell.trim().replace(/^"|"$/g, ''));
            cell = '';
          } else {
            cell += char;
          }
        }
        result.push(cell.trim().replace(/^"|"$/g, ''));
        return result;
      });
    }

    // 從 Google Sheet 抓取資料
    async function loadSubmissionsFromGoogleSheet() {
      const container = document.getElementById("realSubmissionsContainer");
      
      try {
        const fetchUrl = GOOGLE_SHEET_CSV_URL + "&_t=" + new Date().getTime();
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const csvText = await response.text();
        const rows = parseCSVRow(csvText);
        container.innerHTML = "";

        let pendingCount = 0;

        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i];
          if (!cols || cols.length < 4 || !cols[3]) continue;

          const name       = cols[3] || "未提供姓名";
          const age        = cols[4] || "";
          let rawPhone     = cols[6] || "";
          const cleanPhone = rawPhone.replace(/^852/, '').trim(); 
          
          const hiddenCourse = cols[9] || "";
          const hiddenVenue  = cols[10] || "";
          const experience   = cols[11] || "未填寫";
          const formRegion   = cols[12] || "";
          const timeslot     = cols[13] || "";

          // 🧠 嚴格對應你指定的 5 大官方班別名稱
          let courseName = "新手速成班";
          const expLower = experience.toLowerCase();
          if (expLower.includes("急救")) {
            courseName = "急救速成班";
          } else if (expLower.includes("進階") || expLower.includes("規矩") || expLower.includes("修正")) {
            courseName = "技術與體能精準修正班";
          } else if (expLower.includes("高手") || expLower.includes("強")) {
            courseName = "高手班";
          } else if (expLower.includes("1對1") || expLower.includes("私人")) {
            courseName = "1對1私教";
          }
          if (hiddenCourse) courseName = hiddenCourse;

          // 🏟️ 智能分配球場（如果選了港島或九龍，自動分派預設球場；未定則寫暫定）
          let defaultVenue = "暫定";
          if (formRegion.includes("港島")) {
            defaultVenue = "維園球場";
          } else if (formRegion.includes("九龍")) {
            defaultVenue = "歌和老街網球中心";
          }
          if (hiddenVenue) defaultVenue = hiddenVenue;

          pendingCount++;

          const cardHTML = `
            <div class="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-md hover:border-slate-700 transition-all">
              <div class="flex justify-between items-start">
                <div>
                  <span class="font-black text-sm text-white">${name}</span>
                  ${age ? `<span class="text-xs text-slate-400 ml-1.5">(${age}歲)</span>` : ''}
                  <span class="text-xs text-neon-green ml-2 font-bold"><i class="fa-brands fa-whatsapp"></i> ${cleanPhone}</span>
                </div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-neon-green/10 text-neon-green border border-neon-green/30">${courseName}</span>
              </div>

              <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                <div><i class="fa-solid fa-location-dot text-rose-400 mr-1.5"></i><strong>地區：</strong>${formRegion || '港島/九龍'}</div>
                <div><i class="fa-solid fa-clock text-accent-cyan mr-1.5"></i><strong>時段：</strong>${timeslot || '星期日下午'}</div>
              </div>

              <!-- 🚀 AI 8 週自動排班精靈 -->
              <div class="pt-1">
                <button onclick="triggerAI8WeekScheduler('${name}', '${courseName}', '${defaultVenue}')" 
                        class="w-full bg-gradient-to-r from-neon-green to-accent-cyan text-slate-950 text-xs font-black py-2.5 rounded-xl shadow-neon transition-all flex items-center justify-center gap-2">
                  <i class="fa-solid fa-wand-magic-sparkles"></i>
                  <span>一鍵啟動 AI 8 週自動排班精靈</span>
                </button>
              </div>
            </div>
          `;

          container.innerHTML += cardHTML;
        }

        document.getElementById("pendingCountText").innerText = `待處理報名: ${pendingCount} 筆`;

      } catch (error) {
        console.error("無法讀取 Google Sheet 數據：", error);
        container.innerHTML = `
          <div class="text-center py-6 text-xs text-rose-400 space-y-1">
            <i class="fa-solid fa-triangle-exclamation text-lg"></i>
            <p>連線 Google Sheet 失敗，請確認已公開發布為 CSV。</p>
          </div>
        `;
      }
    }

    // 🤖 互動式 AI 8 週排班精靈（支援小數點或短橫線日期，並完美避開時區錯誤）
    function triggerAI8WeekScheduler(studentName, courseName, defaultVenue) {
      const startDateInput = prompt(`🤖 【AI 8 週排班精靈】\n學員：${studentName}\n對應課程：${courseName}\n自動分派球場：${defaultVenue}\n\n請問這 8 週課程要從哪一天開始？\n(請輸入日期，例如: 2026-11-15 或 2026.11.15)`, "2026-11-15");
      if (!startDateInput) return;

      // 統一將點 ( . ) 轉換為橫線 ( - ) 以確保 JS 正確解析
      const normalizedDateStr = startDateInput.trim().replace(/\./g, '-');
      let startDate = new Date(normalizedDateStr + "T15:00:00");

      if (isNaN(startDate.getTime())) {
        alert("❌ 日期格式錯誤！請使用 YYYY-MM-DD 或 YYYY.MM.DD 格式。");
        return;
      }

      const avoidHolidays = confirm("🗓️ 請問遇上香港公眾假期（紅日）時，是否需要自動順延一週？\n\n[確定] = 自動避開紅日\n[取消] = 照常每週上課");

      let addedCount = 0;
      for (let week = 1; week <= 8; week++) {
        let lessonDate = new Date(startDate);
        lessonDate.setDate(startDate.getDate() + (week - 1) * 7);

        let dateStr = lessonDate.toISOString().split('T')[0];
        let startTime = `${dateStr}T15:00:00`;
        let endTime = `${dateStr}T17:00:00`;

        // 🎯 嚴格符合你的命名格式：[課程名稱] (學員名字) @ [球場名稱]
        let eventTitle = `${courseName} (${studentName}) @ ${defaultVenue}`;

        calendar.addEvent({
          title: eventTitle,
          start: startTime,
          end: endTime,
          backgroundColor: '#CCFF00',
          borderColor: '#CCFF00',
          textColor: '#060B19'
        });
        addedCount++;
      }

      alert(`✅ 成功為 ${studentName} 自動生成連續 8 週（每堂 2 小時）課表！`);
    }

    // 安全登出
    function logoutAdmin() {
      sessionStorage.removeItem("admin_authenticated");
      alert("已安全登出！");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
